<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sentinel - Intelligence Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">🛰️ Sentinel</div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link {% if request.endpoint == 'feed' %}active{% endif %}">Feed</a></li>
                <li><a href="/markets" class="nav-link {% if request.endpoint == 'markets' %}active{% endif %}">Markets</a></li>
                <li><a href="/brief" class="nav-link {% if request.endpoint == 'brief' %}active{% endif %}">Brief</a></li>
                <li><a href="/search" class="nav-link {% if request.endpoint == 'search' %}active{% endif %}">Search</a></li>
                <li><a href="/entities" class="nav-link {% if request.endpoint == 'entities' %}active{% endif %}">Entities</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>Sentinel • Personal Intelligence Dashboard • Powered by Claude AI</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
