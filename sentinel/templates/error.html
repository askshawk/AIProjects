{% extends "base.html" %}

{% block title %}Error - Sentinel{% endblock %}

{% block content %}
<div class="error-page">
    <h1>❌ Error</h1>
    <p class="error-message">{{ error }}</p>
    <a href="/" class="btn btn-primary">Back to Feed</a>
</div>

<style>
.error-page {
    padding: 3rem 2rem;
    text-align: center;
    max-width: 500px;
    margin: 2rem auto;
}

.error-page h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
}

.error-message {
    color: #dc2626;
    margin-bottom: 2rem;
    font-size: 1.1rem;
}
</style>
{% endblock %}
