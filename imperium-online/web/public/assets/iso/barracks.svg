<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 188" width="188" height="188">
  <!-- Barracks: a fortified stone hall with crenellations, a hung shield, and a
       red banner. Light from top-left. Anchor bottom-centre. -->
  <g stroke="#352a1c" stroke-width="1.6" stroke-linejoin="round">
    <!-- walls -->
    <polygon points="22,82 94,118 94,158 22,122" fill="#cabd9c"/>
    <polygon points="94,118 166,82 166,122 94,158" fill="#a99c78"/>
    <!-- masonry courses -->
    <g stroke="#b3a47e" stroke-width="1">
      <line x1="22" y1="98" x2="94" y2="134"/>
      <line x1="22" y1="110" x2="94" y2="146"/>
    </g>
    <g stroke="#90835f" stroke-width="1">
      <line x1="94" y1="134" x2="166" y2="98"/>
      <line x1="94" y1="146" x2="166" y2="110"/>
    </g>
    <!-- gate -->
    <path d="M58 154 L58 128 Q72 120 86 128 L86 158 Z" fill="#4a3a24"/>
    <path d="M58 128 Q72 120 86 128" fill="none" stroke="#6e5a36" stroke-width="3"/>
    <!-- round shield on the lit wall -->
    <circle cx="48" cy="118" r="11" fill="#b5532f" stroke="#7d3320" stroke-width="2"/>
    <circle cx="48" cy="118" r="4" fill="#d5a843"/>
    <!-- crenellated parapet (top of walls) -->
    <polygon points="22,82 94,118 94,104 22,68" fill="#ddd0ad"/>
    <polygon points="94,118 166,82 166,68 94,104" fill="#bdaf88"/>
    <g fill="#e7dab6" stroke="#b3a074" stroke-width="1">
      <polygon points="26,71 38,77 38,69 26,63"/>
      <polygon points="46,81 58,87 58,79 46,73"/>
      <polygon points="66,91 78,97 78,89 66,83"/>
    </g>
    <g fill="#c9bb93" stroke="#9a8c66" stroke-width="1">
      <polygon points="110,97 122,91 122,83 110,89"/>
      <polygon points="130,87 142,81 142,73 130,79"/>
      <polygon points="150,77 162,71 162,63 150,69"/>
    </g>
  </g>
  <!-- banner pole + red pennant -->
  <line x1="94" y1="104" x2="94" y2="34" stroke="#5e3a1a" stroke-width="3"/>
  <path d="M94 38 L126 46 L94 58 Z" fill="#b5532f" stroke="#7d3320" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
