<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Forum: a classical temple — stepped stylobate, a colonnade with a
       pedimented gable and gold akroterion, terracotta roof. The civic
       centrepiece. Light from top-left. Anchor bottom-centre. -->
  <g stroke="#352a1c" stroke-width="1.6" stroke-linejoin="round">
    <!-- stylobate (stepped stone platform) -->
    <polygon points="22,143 100,182 100,164 22,125" fill="#cdbd92"/>
    <polygon points="100,182 178,143 178,125 100,164" fill="#b3a074"/>
    <polygon points="22,125 100,164 178,125 100,86" fill="#e7dab6"/>
    <polygon points="34,131 100,164 166,131 100,98" fill="none" stroke="#b3a074" stroke-width="1.2"/>

    <!-- right cella wall + its terracotta roof slope (behind colonnade) -->
    <polygon points="100,164 178,125 178,84 100,123" fill="#c2af82"/>
    <polygon points="100,123 178,84 138,64 100,103" fill="#a8472a"/>
    <polygon points="100,103 138,64 100,46" fill="#bd5a39"/>

    <!-- colonnade: six columns across the lit facade -->
    <g>
      <!-- entablature the columns carry -->
      <polygon points="22,113 100,152 100,140 22,101" fill="#ddcfa8"/>
      <!-- columns (base edge 22,125 -> 100,164; tops 12px above entablature) -->
      <g>
        <!-- each column: shaft + capital + base -->
        <g fill="#efe6cf" stroke="#b3a074" stroke-width="1">
          <rect x="28" y="104" width="9" height="48"/>
          <rect x="42" y="111" width="9" height="48"/>
          <rect x="56" y="118" width="9" height="48"/>
          <rect x="70" y="125" width="9" height="48"/>
          <rect x="84" y="132" width="9" height="48"/>
        </g>
        <!-- shaded right side of each shaft -->
        <g fill="#d4c4a0" stroke="none">
          <rect x="34" y="104" width="3" height="48"/>
          <rect x="48" y="111" width="3" height="48"/>
          <rect x="62" y="118" width="3" height="48"/>
          <rect x="76" y="125" width="3" height="48"/>
          <rect x="90" y="132" width="3" height="48"/>
        </g>
        <!-- capitals -->
        <g fill="#e7dab6" stroke="#b3a074" stroke-width="1">
          <rect x="26" y="100" width="13" height="6"/>
          <rect x="40" y="107" width="13" height="6"/>
          <rect x="54" y="114" width="13" height="6"/>
          <rect x="68" y="121" width="13" height="6"/>
          <rect x="82" y="128" width="13" height="6"/>
        </g>
      </g>
    </g>

    <!-- pediment (gable) over the facade -->
    <polygon points="22,101 100,140 100,128 22,89" fill="#e7dab6"/>
    <polygon points="22,89 61,72 100,128 100,103" fill="#f1e7c8"/>
    <circle cx="58" cy="103" r="7" fill="#d5a843" stroke="#a07d22" stroke-width="1.2"/>
    <!-- terracotta roof over the pediment -->
    <polygon points="22,89 61,72 100,91 100,103" fill="#cf6f4a"/>
    <polygon points="61,72 100,53 100,91" fill="#bd5a39"/>
  </g>
</svg>
