<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="176" height="176">
  <!-- Timber Camp: a timber-framed lodge with a wood-shingle roof and a pile of
       cut logs out front. Light from top-left. Anchor bottom-centre. -->
  <g stroke="#352a1c" stroke-width="1.5" stroke-linejoin="round">
    <!-- walls -->
    <polygon points="18,71 88,106 88,150 18,115" fill="#a4703c"/>
    <polygon points="88,106 158,71 158,115 88,150" fill="#7c5128"/>
    <!-- plank seams -->
    <g stroke="#79502a" stroke-width="1.1">
      <line x1="41" y1="83" x2="41" y2="127"/>
      <line x1="64" y1="95" x2="64" y2="139"/>
    </g>
    <g stroke="#5e3a1a" stroke-width="1.1">
      <line x1="111" y1="95" x2="111" y2="139"/>
      <line x1="134" y1="83" x2="134" y2="127"/>
    </g>
    <!-- door -->
    <polygon points="74,118 88,125 88,150 74,143" fill="#4a3018"/>
    <!-- hip roof (wood shingle) -->
    <polygon points="18,71 88,106 88,30" fill="#6e4a26"/>
    <polygon points="88,106 158,71 88,30" fill="#503519"/>
    <line x1="88" y1="30" x2="88" y2="106" stroke="#3a2814" stroke-width="1.4"/>
    <polygon points="18,71 88,30 88,38 24,76" fill="#7e5730" opacity="0.6" stroke="none"/>
  </g>
  <!-- log pile out front -->
  <g stroke="#4a3018" stroke-width="1.4">
    <ellipse cx="44" cy="150" rx="9" ry="7" fill="#9a6a3a"/>
    <ellipse cx="62" cy="156" rx="9" ry="7" fill="#9a6a3a"/>
    <ellipse cx="53" cy="140" rx="9" ry="7" fill="#a8784a"/>
    <circle cx="44" cy="150" r="3.2" fill="#caa06a"/>
    <circle cx="62" cy="156" r="3.2" fill="#caa06a"/>
    <circle cx="53" cy="140" r="3.2" fill="#caa06a"/>
  </g>
</svg>
