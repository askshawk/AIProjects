<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 66" width="130" height="66">
  <!-- 2:1 isometric grass tile. Drawn edge-to-edge so tiles abut seamlessly. -->
  <polygon points="65,0 130,33 65,66 0,33" fill="#7fa653"/>
  <polygon points="65,0 130,33 65,66 0,33" fill="none" stroke="#6b8f44" stroke-width="1"/>
  <!-- subtle top-left light, bottom-right shade -->
  <polygon points="65,0 130,33 65,33 0,33" fill="#88b059" opacity="0.5"/>
  <polygon points="65,33 130,33 65,66 0,33" fill="#6f9447" opacity="0.4"/>
  <!-- a few grass tufts -->
  <g fill="#5f8038" opacity="0.7">
    <path d="M45,30 l1,-4 l1,4 z"/>
    <path d="M80,38 l1,-4 l1,4 z"/>
    <path d="M62,24 l1,-3 l1,3 z"/>
    <path d="M70,46 l1,-4 l1,4 z"/>
  </g>
</svg>
