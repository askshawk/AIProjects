# Fly.io config for the Imperium Online API.
#
# `fly launch --no-deploy` will offer to generate its own; use this instead —
# it already carries the settings this app needs.
#
# Set the app name and region to whatever `fly launch` gives you.

app = "imperium-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  # Fly's proxy sets X-Forwarded-For, so the rate limiter can trust it here.
  # (It is off by default — trusting that header without a proxy in front lets
  # any client forge an address and mint itself a fresh budget.)
  TRUST_PROXY = "1"
  # The API and the web app are on different domains, so the session cookie
  # must be SameSite=None, which requires Secure.
  COOKIE_SECURE = "1"

# Secrets are NOT set here — they would be committed. Use:
#   fly secrets set JWT_SECRET=... DATABASE_URL=... CORS_ORIGINS=...

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine alive. Scaling to zero would drop every open WebSocket and
  # stop the background worker that resolves battles while players are away —
  # the whole point of an async game.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # One process: the WebSocket registry and rate-limit counters live in memory.
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
