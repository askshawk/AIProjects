{% extends "base.html" %}

{% block title %}Articles - News Analysis AI Agent{% endblock %}

{% block content %}
<div class="articles-page">
    <h1>📰 Articles</h1>

    <div class="controls">
        <div class="filter-group">
            <label>Filter by Relevance:</label>
            <button class="filter-btn active" data-filter="">All</button>
            <button class="filter-btn" data-filter="HIGH">🔴 HIGH</button>
            <button class="filter-btn" data-filter="MEDIUM">🟡 MEDIUM</button>
            <button class="filter-btn" data-filter="LOW">🟢 LOW</button>
        </div>

        <div class="search-group">
            <input type="text" id="searchInput" placeholder="🔍 Search articles...">
        </div>

        <div class="sort-group">
            <label>Sort by:</label>
            <select id="sortSelect">
                <option value="fetched">Most Recent</option>
                <option value="significance">Highest Significance</option>
            </select>
        </div>

        <a href="/api/export" class="btn btn-secondary" id="exportBtn">📥 Export CSV</a>
    </div>

    <div id="articlesContainer" class="articles-container">
        <div class="loading">Loading articles...</div>
    </div>
</div>

<script>
let currentFilter = '';
let currentSearch = '';
let currentSort = 'fetched';

function loadArticles() {
    const params = new URLSearchParams();
    if (currentFilter) params.append('relevance', currentFilter);
    if (currentSearch) params.append('search', currentSearch);
    params.append('sort', currentSort);

    fetch(`/api/articles?${params}`)
        .then(response => response.json())
        .then(articles => displayArticles(articles))
        .catch(error => {
            console.error('Error loading articles:', error);
            document.getElementById('articlesContainer').innerHTML = '<p class="error">Error loading articles</p>';
        });
}

function displayArticles(articles) {
    const container = document.getElementById('articlesContainer');

    if (articles.length === 0) {
        container.innerHTML = '<p class="empty-state">No articles found. <a href="/fetch">Fetch some news!</a></p>';
        return;
    }

    container.innerHTML = articles.map(article => `
        <div class="article-card">
            <div class="article-header">
                <h3>${escapeHtml(article.title)}</h3>
                <div class="article-badges">
                    <span class="badge relevance-${(article.geopolitical_relevance || 'unknown').toLowerCase()}">
                        ${article.geopolitical_relevance || 'Unknown'}
                    </span>
                    <span class="badge score">⭐ ${article.significance_score || 0}/10</span>
                </div>
            </div>
            <div class="article-meta">
                <span class="source">📰 ${escapeHtml(article.source)}</span>
                <span class="date">📅 ${new Date(article.fetched_at).toLocaleDateString()}</span>
            </div>
            <p class="article-summary">${escapeHtml(article.summary || 'No summary available')}</p>
            <a href="${escapeHtml(article.url)}" target="_blank" class="article-link">Read Full Article →</a>
        </div>
    `).join('');
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Event listeners
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        loadArticles();
    });
});

document.getElementById('searchInput').addEventListener('input', function(e) {
    currentSearch = e.target.value;
    loadArticles();
});

document.getElementById('sortSelect').addEventListener('change', function(e) {
    currentSort = e.target.value;
    loadArticles();
});

// Update export button
document.getElementById('exportBtn').addEventListener('click', function(e) {
    if (currentFilter) {
        e.target.href = `/api/export?relevance=${currentFilter}`;
    }
});

// Load articles on page load
loadArticles();
</script>
{% endblock %}
